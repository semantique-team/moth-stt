# E-004 — H1 probe: frozen Whisper-tiny encoder + linear CTC head (design: docs/04 §5-H1).
# Arm B: input `padded30`. Batches are smaller than arm A on purpose: padded 30 s windows cost
# 4x the attention memory per clip, so 64 clips / 320 s would need ~17 GB (measured, 2026-10-19).
run: E-004-padded30
seed: 0

model:
  vocab_size: 1024
  init: models/whisper_tiny_encoder.pt   # stt/convert_whisper.py (gitignored, reproducible)
  freeze_encoder: true                    # H1 trains the head only

# Trained once the mixed pool exists (task 2.3); never contains test text.
tokenizer: data/tokenizer/moth_bpe.model

data:
  # The H1 recipe says ≈ 100 h Italian (Common Voice + MLS); today MLS IT is the 169.9 h
  # available in the mel cache and is used whole — Common Voice IT 27 joins when fetched.
  train:
    - manifest: data/manifests/mls_it_train.jsonl
      shards: data/shards/mls_it_train
  dev:
    - manifest: data/manifests/mls_it_dev.jsonl
      shards: data/shards/mls_it_dev

batch:
  max_seconds: 96       # padded: keeps the batch at ~4.2 GB like arm A
  max_clips: 8

optimizer:
  lr_head: 1.0e-3
  lr_encoder: 1.0e-4      # unused while the encoder is frozen; kept for the H2 continuation
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

schedule:
  warmup_steps: 500
  min_factor: 0.05

train:
  epochs: 3
  input: padded30
  augment: light          # H1: frequency masks only (docs/04 §4)
  autocast: bf16
  grad_clip: 1.0
  log_every: 50
  checkpoint_minutes: 20
  keep_last: 3
  max_nonfinite_steps: 20
  eval_every_steps: 1500
