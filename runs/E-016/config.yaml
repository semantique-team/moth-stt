# E-016 — gold fine-tune on the recorded R-S1 set (H3a, first arm).
#
# One variable vs E-014: the training mix gains the 29.3 min of recorded Italian-English gold
# (S1, 635 sentences, 0 errors), repeated 50x so the terms actually get gradient share. Everything
# else is E-014: same init, same natural + spliced mix, same continuation LRs and schedule.
#
# Mixture: natural 438 h + spliced 110 h + gold 24.4 h (50 x 29.3 min) = 572.4 h; gold is 4.3% of
# the audio. The plan's H3b/H3a target was "gold >= 20% of the batches", which with 29 min of gold
# would need a 220x repetition — that is memorisation, not supervision. 50x (each sentence seen
# 100 times over 2 epochs) is the probe: if hearing deadline/merge/kpi inside Italian sentences
# moves the ETA at all, a second arm can scale the exposure; if it does not, the hypothesis is dead
# cheaply.
#
# Caveat to state in the paper: R-S1 and T are both S1, so a gain here is real for the product but
# optimistic as a generalisation claim. E-017 (S2 train, S3 held out) is the fix.
run: E-016
seed: 0

model:
  vocab_size: 1024
  init: models/whisper_tiny_encoder.pt
  init_checkpoint: runs/E-014/checkpoints/ckpt_best.pt
  head_blocks: 2
  freeze_encoder: false

tokenizer: data/tokenizer/moth_bpe.model

data:
  # ≈ 572 h: CV IT 167.8 + MLS IT 169.9 + LS EN 100 + spliced 110 + gold 24.4 (R-S1 x50).
  train:
    - manifest: data/manifests/cv_it_train.jsonl
      shards: data/shards/cv_it_train
    - manifest: data/manifests/mls_it_train.jsonl
      shards: data/shards/mls_it_train
    - manifest: data/manifests/ls_en_train.jsonl
      shards: data/shards/ls_en_train
    - manifest: data/manifests/spliced_it_en.jsonl
      shards: data/shards/spliced_it_en
    - manifest: data/shards/R-S1-x50/manifest.jsonl
      shards: data/shards/R-S1-x50
  dev:
    - manifest: data/manifests/mls_it_dev.jsonl
      shards: data/shards/mls_it_dev
  dev_en:
    - manifest: data/manifests/ls_en_dev.jsonl
      shards: data/shards/ls_en_dev

batch:
  max_seconds: 192
  max_clips: 32

optimizer:
  # Same continuation LRs as E-012/E-014.
  lr_head: 3.0e-4
  lr_encoder: 5.0e-5
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

schedule:
  warmup_steps: 500
  min_factor: 0.05

train:
  epochs: 2
  input: truncated
  augment: full
  autocast: bf16
  grad_clip: 1.0
  log_every: 50
  checkpoint_minutes: 10
  keep_last: 3
  max_nonfinite_steps: 20
  empty_cache_every: 50
  eval_every_steps: 2000
