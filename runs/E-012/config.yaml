# E-012 — more English data: fine-tune E-006 with LibriSpeech train-clean-360 (+200 h).
#
# One variable vs E-006: the English training audio grows from 100 h (train-clean-100) to 300 h
# (100 + a deterministic 200 h sample of train-clean-360). Tokenizer, architecture and decoder are
# unchanged. The Italian data stays at 337.7 h, so the mixture moves from 77/23 to ~53/47 IT/EN.
# Starting point: E-006 best (11.58 M, 2 head blocks). 2 epochs, lower LR than the original run.
run: E-012
seed: 0

model:
  vocab_size: 1024
  init: models/whisper_tiny_encoder.pt
  init_checkpoint: runs/E-006/checkpoints/ckpt_best.pt
  head_blocks: 2
  freeze_encoder: false

tokenizer: data/tokenizer/moth_bpe.model

data:
  # ≈ 638 h: CV IT 167.8 + MLS IT 169.9 + LS EN 100 + LS EN 200 (train-clean-360 sample).
  train:
    - manifest: data/manifests/cv_it_train.jsonl
      shards: data/shards/cv_it_train
    - manifest: data/manifests/mls_it_train.jsonl
      shards: data/shards/mls_it_train
    - manifest: data/manifests/ls_en_train.jsonl
      shards: data/shards/ls_en_train
    - manifest: data/manifests/ls_en_train360.jsonl
      shards: data/shards/ls_en_train360
  dev:
    - manifest: data/manifests/mls_it_dev.jsonl
      shards: data/shards/mls_it_dev
  dev_en:
    - manifest: data/manifests/ls_en_dev.jsonl
      shards: data/shards/ls_en_dev

batch:
  max_seconds: 192
  max_clips: 32

optimizer:
  # Continued fine-tune from E-006: lower LR than the original H2 run (head 1e-3 / encoder 5e-5).
  lr_head: 3.0e-4
  lr_encoder: 5.0e-5
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

schedule:
  warmup_steps: 500
  min_factor: 0.05

train:
  epochs: 2
  input: truncated
  augment: full
  autocast: bf16
  grad_clip: 1.0
  log_every: 50
  checkpoint_minutes: 10
  keep_last: 3
  max_nonfinite_steps: 20
  empty_cache_every: 50
  eval_every_steps: 2000
