<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moth — browser smoke test</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; max-width: 60rem; }
      pre { background: color-mix(in srgb, currentColor 8%, transparent); padding: 1rem; white-space: pre-wrap; }
      .ok { color: #0a8a3a; }
      .bad { color: #c0392b; }
    </style>
  </head>
  <body>
    <h1>Moth — browser smoke test (Task 3.5)</h1>
    <p id="status">loading release…</p>
    <p>
      <input type="file" id="file" accept="audio/*" disabled />
      <button id="record" disabled>Registra</button>
      <button id="stop" disabled>Stop</button>
      <button id="run" disabled>Transcribe</button>
      <button id="bench" disabled>Benchmark (2 warm-ups + 5 runs)</button>
    </p>
    <pre id="out">—</pre>

    <script type="module">
      import { computeMel } from "./mel.js";
      import { startMicrophone } from "./mic.js";
      import { createRunner, decodeTo16k } from "./ort.js";

      const status = document.getElementById("status");
      const output = document.getElementById("out");
      const recordButton = document.getElementById("record");
      const stopButton = document.getElementById("stop");
      const runButton = document.getElementById("run");
      const benchButton = document.getElementById("bench");
      const fileInput = document.getElementById("file");

      window.moth = {
        ready: false,
        error: null,
        createRunner,
        decodeTo16k,
        computeMel,
        startMicrophone,
        getPcm: () => pcm,
      };

      let pcm = null;
      let recording = null;
      let microphoneRequest = null;
      let stopping = false;
      let processing = false;
      let fileLoading = false;
      let selection = 0;

      function updateControls() {
        const busy = !!microphoneRequest || !!recording || stopping || processing;
        fileInput.disabled = !window.moth.ready || busy;
        recordButton.disabled = !window.moth.ready || busy || fileLoading;
        stopButton.disabled = !microphoneRequest && !recording;
        runButton.disabled = benchButton.disabled =
          !window.moth.ready || busy || fileLoading || !pcm || pcm.length < 1600;
      }

      function show(value) {
        output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      try {
        const params = new URLSearchParams(location.search);
        const threadParam = params.get("threads");
        const runner = await createRunner({
          baseUrl: new URL("../release/", location.href).href,
          threads: threadParam ? Number(threadParam) : null,
        });
        Object.assign(window.moth, {
          runner,
          transcribePcm: (samples) => runner.transcribe(samples),
          benchmark: (samples, options) => runner.benchmark(samples, options),
          ready: true,
        });
        updateControls();
        status.className = "ok";
        status.textContent =
          `release loaded in ${runner.loadMs.toFixed(0)} ms — ` +
          `isolated=${runner.crossOriginIsolated}, threads=${runner.numThreads}, SIMD=${runner.simd}`;
      } catch (error) {
        window.moth.error = String(error);
        status.className = "bad";
        status.textContent = `failed to load the release: ${error}`;
      }

      fileInput.addEventListener("change", async (event) => {
        if (fileInput.disabled) return;
        const current = ++selection;
        pcm = null;
        const file = event.target.files[0];
        fileLoading = !!file;
        updateControls();
        if (!file) return;
        const url = URL.createObjectURL(file);
        try {
          const samples = await decodeTo16k(url);
          if (current !== selection) return;
          pcm = samples;
          status.className = "ok";
          status.textContent =
            `${file.name}: ${(pcm.length / 16000).toFixed(2)} s @ 16 kHz mono`;
        } catch (error) {
          if (current !== selection) return;
          status.className = "bad";
          status.textContent = `could not decode ${file.name}: ${error}`;
        } finally {
          URL.revokeObjectURL(url);
          if (current === selection) {
            fileLoading = false;
            updateControls();
          }
        }
      });

      async function stopRecording() {
        if (microphoneRequest) {
          microphoneRequest = null;
          status.className = "";
          status.textContent = "richiesta microfono annullata";
          updateControls();
          return;
        }
        if (!recording) return;
        const active = recording;
        recording = null;
        stopping = true;
        updateControls();
        status.className = "";
        status.textContent = "resampling to 16 kHz…";
        try {
          pcm = await active.stop();
          const ready = window.moth.ready && pcm.length >= 1600;
          if (!ready) {
            status.className = "bad";
            status.textContent = "registrazione troppo corta (serve almeno 0,1 s)";
          } else {
            status.className = "ok";
            status.textContent = `microfono: ${(pcm.length / 16000).toFixed(2)} s @ 16 kHz mono`;
          }
        } catch (error) {
          pcm = null;
          status.className = "bad";
          status.textContent = `errore microfono: ${error}`;
        } finally {
          stopping = false;
          updateControls();
        }
      }

      recordButton.addEventListener("click", async () => {
        if (recordButton.disabled) return;
        const request = {};
        microphoneRequest = request;
        ++selection;
        pcm = null;
        updateControls();
        try {
          status.className = "";
          status.textContent = "registrazione… premi Stop (max 30 s)";
          const active = await startMicrophone({
            maxSeconds: 30,
            onLimit: () => {
              if (microphoneRequest === request || recording === request.active) {
                void stopRecording();
              }
            },
          });
          if (microphoneRequest !== request) {
            // Permission cannot be aborted; release a late grant without publishing its PCM.
            for (const track of active.stream.getTracks()) track.stop();
            await active.stop();
            return;
          }
          request.active = active;
          microphoneRequest = null;
          recording = active;
          updateControls();
        } catch (error) {
          if (microphoneRequest !== request) return;
          microphoneRequest = null;
          recording = null;
          updateControls();
          status.className = "bad";
          status.textContent = `permesso microfono negato o non disponibile: ${error}`;
        }
      });

      stopButton.addEventListener("click", () => {
        void stopRecording();
      });

      for (const button of [runButton, benchButton]) {
        button.addEventListener("click", async () => {
          if (button.disabled) return;
          processing = true;
          updateControls();
          try {
            show(await (button === runButton
              ? window.moth.transcribePcm(pcm)
              : window.moth.benchmark(pcm, { runs: 5, warmups: 2 })));
          } catch (error) {
            status.className = "bad";
            status.textContent = `processing failed: ${error}`;
          } finally {
            processing = false;
            updateControls();
          }
        });
      }
    </script>
  </body>
</html>
