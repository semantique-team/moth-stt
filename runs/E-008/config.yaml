# E-008 — small BPE trigram LM in shallow fusion with E-007 beam search.
#
# The acoustic model is E-006 best (frozen). The LM is trained only on the three *_train
# manifests; dev/FLEURS/CV/T never enter its corpus. Alpha was selected on the two dev sets
# (200-clip subset, then confirmed on the full dev); the held-out sets were evaluated once.
run: E-008
checkpoint: runs/E-006/checkpoints/ckpt_best.pt
model_config: runs/E-006/config.yaml

lm:
  path: runs/E-008/lm_bpe3.pkl.gz
  type: bpe_trigram
  vocab: 1026          # 1024 SentencePiece ids + BOS/EOS
  min_bigram_count: 2
  min_trigram_count: 2
  backoff: 0.4
  size_mb: 3.53

decode:
  method: beam
  beam_width: 5
  top_k: 8
  lm_weight: 0.2

results:
  dev_macro: 0.2705
  fleurs_it_test: 0.2902
  fleurs_en_test: 0.5699
  cv_it_dev: 0.2839
  cv_it_test: 0.3007
  recorded_t: 0.5537
  recorded_t_eta: 0.2149
  fleurs_it_vs_whisper_tiny: -0.0306
  cv_it_dev_vs_whisper_tiny: -0.2013
