# E-015 — 50 term-rich S1 sentences for the 44 terms never seen in training.
#
# One variable against E-024: a new gold source of 50 recorded sentences (2.5 min), repeated x20
# (0.84 h), added to the same 589.5 h mixture. The old gold (R-S1/R-S2) stays at x50; the new
# terms are not folded into it. Init: E-024 best (0.7.0), 1 epoch, same LRs/schedule.
#
# Why: 0.7.0 gets 17.0% on the 44 terms that appear in no training text and 74.1% on the 18
# already covered by gold. Target: 17% -> >=50% on the 47 utterances, ETA +2-4, WER not worse.
# See runs/E-015/PLAN.md (addendum) and runs/E-015/RECORDING.md.
run: E-015
seed: 0

model:
  vocab_size: 1024
  init: models/whisper_tiny_encoder.pt
  init_checkpoint: runs/E-024/checkpoints/ckpt_best.pt
  head_blocks: 2
  freeze_encoder: false

tokenizer: data/tokenizer/moth_bpe.model

data:
  # ≈ 590 h, unchanged from E-017: CV-IT 167.8 (84.2 clean + 83.6 noisy) + MLS IT 169.9 +
  # LS EN 100 + spliced 110 + gold 41.87.
  train:
    - manifest: data/manifests/cv_it_train_clean50.jsonl
      shards: data/shards/cv_it_train
    - manifest: data/manifests/cv_it_train_noisy50.jsonl
      shards: data/shards/cv_it_noisy50
    - manifest: data/manifests/mls_it_train.jsonl
      shards: data/shards/mls_it_train
    - manifest: data/manifests/ls_en_train.jsonl
      shards: data/shards/ls_en_train
    - manifest: data/manifests/spliced_it_en.jsonl
      shards: data/shards/spliced_it_en
    - manifest: data/shards/gold-x50/manifest.jsonl
      shards: data/shards/gold-x50
    # The 50 new S1 sentences, 2.5 min x20 = 0.84 h. Separate from gold-x50 on purpose: the old
    # gold is 1,263 sentences and x50; these 50 templates would overfit at x50.
    - manifest: data/shards/gold-terms-x20/manifest.jsonl
      shards: data/shards/gold-terms-x20
  dev:
    - manifest: data/manifests/mls_it_dev.jsonl
      shards: data/shards/mls_it_dev
  dev_en:
    - manifest: data/manifests/ls_en_dev.jsonl
      shards: data/shards/ls_en_dev

batch:
  max_seconds: 192
  max_clips: 32

optimizer:
  lr_head: 3.0e-4
  lr_encoder: 5.0e-5
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

schedule:
  warmup_steps: 500
  min_factor: 0.05

train:
  epochs: 1
  input: truncated
  augment: full
  autocast: bf16
  grad_clip: 1.0
  log_every: 50
  checkpoint_minutes: 10
  keep_last: 3
  max_nonfinite_steps: 20
  empty_cache_every: 10
  eval_every_steps: 2000
