name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_TORCH_BACKEND: cpu
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_KEYRING_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked --all-extras ruff check .
      - name: Tests
        run: uv run --locked --all-extras pytest -q
      - name: Build wheel
        run: |
          uv lock --check
          uv build --wheel
      - name: Wheel smoke (no training dependencies)
        shell: bash
        run: |
          uv venv /tmp/moth-wheel-smoke
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/moth-runtime.txt
          uv pip sync --python /tmp/moth-wheel-smoke/bin/python /tmp/moth-runtime.txt
          uv pip install --python /tmp/moth-wheel-smoke/bin/python --no-deps dist/*.whl
          /tmp/moth-wheel-smoke/bin/python -I - <<'PY'
          import importlib.util
          from pathlib import Path
          import numpy
          import onnxruntime
          import soundfile
          import stt.decode
          import stt.features
          import stt.lm
          import stt.onnx_runner
          import stt.release
          import stt.text
          import stt.vad
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("sentencepiece") is None
          assert importlib.util.find_spec("onnx") is None
          root = Path(stt.release.__file__).parent
          assert (root / "assets/mel_filters.bin").stat().st_size == 64320
          assert (root / "assets/silero_vad.onnx").stat().st_size > 0
          PY
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lightweight Node tests (no browser or model download)
        shell: bash
        run: |
          shopt -s globstar nullglob
          tests=(web/tests/**/*.test.js web/tests/**/*.test.mjs web/tests/**/*.test.cjs)
          if ((${#tests[@]})); then
            node --experimental-vm-modules --test "${tests[@]}"
          else
            echo 'No lightweight Node tests present; Playwright/model gates remain separate.'
          fi
