[project]
name = "moth-stt"
version = "0.0.1"
description = "Moth — a very small open Italian+English code-switching speech-to-text model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "onnxruntime",
    "soundfile",
    "num2words",
]

[project.optional-dependencies]
training = [
    "torch==2.14.*",
    "sentencepiece",
    "pyyaml",
]
export = [
    "onnx",
    "torch==2.14.*",
    "sentencepiece",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "transformers",
    "openai-whisper",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stt"]

[tool.hatch.build.targets.wheel.force-include]
"stt/assets/mel_filters.bin" = "stt/assets/mel_filters.bin"
"stt/assets/silero_vad.onnx" = "stt/assets/silero_vad.onnx"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
