# E-014 — H3b utterance-level IT+EN splicing (no recordings, no gold data yet).
#
# One variable vs E-006: the training mix gains 110 h of spliced utterances (an Italian clip
# followed by an English clip, transcript = concatenation), so the model actually sees a switch
# *inside* one utterance instead of only in separate clips. Everything else (tokenizer, model,
# augment, batch, schedule) is E-012's, so E-012 and E-014 differ only in the data.
#
# Mixture: natural 438 h (CV IT 167.8 + MLS IT 169.9 + LS EN 100) + 110 h spliced = 548 h,
# i.e. IT 61.6% / EN 18.3% / spliced 20.1%. The plan's H3b shares (IT 0.4 / EN 0.15 / gold 0.2 /
# spliced 0.25) assume the recorded gold set, which does not exist yet (R-S1 is at 76/600);
# this arm therefore tests splicing alone, the question being "does a within-utterance switch
# move the mixed-set ETA?" (E-012 and E-013 both left it at 21.49).
#
# Spliced set: stt/data/build_spliced.py, seed 0, pairs ≤ 27 s (encoder window + tempo stretch),
# IT pool = CV train + MLS train, EN pool = LibriSpeech train-clean-100.
run: E-014
seed: 0

model:
  vocab_size: 1024
  init: models/whisper_tiny_encoder.pt
  init_checkpoint: runs/E-006/checkpoints/ckpt_best.pt
  head_blocks: 2
  freeze_encoder: false

tokenizer: data/tokenizer/moth_bpe.model

data:
  # ≈ 548 h: CV IT 167.8 + MLS IT 169.9 + LS EN 100 + spliced 110.
  train:
    - manifest: data/manifests/cv_it_train.jsonl
      shards: data/shards/cv_it_train
    - manifest: data/manifests/mls_it_train.jsonl
      shards: data/shards/mls_it_train
    - manifest: data/manifests/ls_en_train.jsonl
      shards: data/shards/ls_en_train
    - manifest: data/manifests/spliced_it_en.jsonl
      shards: data/shards/spliced_it_en
  dev:
    - manifest: data/manifests/mls_it_dev.jsonl
      shards: data/shards/mls_it_dev
  dev_en:
    - manifest: data/manifests/ls_en_dev.jsonl
      shards: data/shards/ls_en_dev

batch:
  max_seconds: 192
  max_clips: 32

optimizer:
  # Same continuation LRs as E-012: E-012 and E-014 differ only in the training data.
  lr_head: 3.0e-4
  lr_encoder: 5.0e-5
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01

schedule:
  warmup_steps: 500
  min_factor: 0.05

train:
  epochs: 2
  input: truncated
  augment: full
  autocast: bf16
  grad_clip: 1.0
  log_every: 50
  checkpoint_minutes: 10
  keep_last: 3
  max_nonfinite_steps: 20
  empty_cache_every: 50
  eval_every_steps: 2000
